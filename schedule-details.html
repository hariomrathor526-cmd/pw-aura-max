<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .title-display {
            font-size: 16px;
            font-weight: 600;
            color: #1a73e8;
            margin: 15px 0;
            word-break: break-word;
            line-height: 1.4;
            min-height: 40px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="loader" class="loader"></div>
        <div id="topicText" class="title-display">Lecture Title Loading...</div>
        <a id="playLink" href="#" class="play-btn" style="display:none;">Play Video</a>
    </div>

    <script>
        async function loadLectureData() {
            const urlParams = new URLSearchParams(window.location.search);

            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';

            let topicName = '';

            // Step 1: Pehle check karo agar URL me direct title pass kiya ho
            topicName = urlParams.get('title') || urlParams.get('topic') || urlParams.get('topicName');

            // Step 2: Agar URL me nahi hai, toh API se schedule details fetch karo
            if (!topicName && scheduleId) {
                try {
                    // Try PW / Penpaper worker API endpoints
                    const apiUrls = [
                        `https://api.penpaper.workers.dev/schedule/${scheduleId}`,
                        `https://pw-steel-beta.vercel.app/api/schedule?scheduleId=${scheduleId}`
                    ];

                    for (let api of apiUrls) {
                        try {
                            const res = await fetch(api);
                            if (res.ok) {
                                const json = await res.json();
                                const data = json.data || json;
                                if (data.topic || data.title || data.name || data.topicName) {
                                    topicName = data.topic || data.title || data.name || data.topicName;
                                    break;
                                }
                            }
                        } catch (err) {
                            console.log("API fetch failed for:", api);
                        }
                    }
                } catch (e) {
                    console.log("Error fetching topic from API", e);
                }
            }

            // Step 3: Agar API se bhi na mile, toh Local/Session Storage check karo
            if (!topicName) {
                topicName = localStorage.getItem(`topic_${scheduleId}`) || 
                            localStorage.getItem('current_topic') || 
                            sessionStorage.getItem('topicName');
            }

            // Fallback Text if all fail
            if (!topicName) {
                topicName = "Lecture " + scheduleId.substring(0, 6);
            }

            // Update Screen
            document.getElementById('loader').style.display = 'none';
            document.getElementById('topicText').innerText = topicName;

            // Generate Target Player URL
            const playerBaseUrl = 'https://studyaura.online/player';
            const finalPlayerUrl = `${playerBaseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(topicName)}`;

            const playBtn = document.getElementById('playLink');
            playBtn.href = finalPlayerUrl;
            playBtn.style.display = 'inline-block';
        }

        window.onload = loadLectureData;
    </script>
</body>
</html>
