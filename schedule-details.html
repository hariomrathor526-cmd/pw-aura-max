<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Player Router</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            body {
                height: 100vh;
                background: #000;
                font-family: 'DM Sans', sans-serif;
                color: #e8e8f0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .loader-box {
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            .spinner {
                width: 42px;
                height: 42px;
                border: 3px solid rgba(90, 75, 218, 0.2);
                border-top-color: #5a4bda;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            p {
                font-size: 14px;
                color: rgba(255, 255, 255, 0.7);
            }
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>
        <div class="loader-box">
            <div class="spinner"></div>
            <p id="statusText">Opening Player...</p>
        </div>

        <script>
            (function routePlayer() {
                const urlParams = new URLSearchParams(window.location.search);
                const statusText = document.getElementById('statusText');

                // 1. Parameters extract karein jo URL me aa rahe hain
                const rc = urlParams.get('rc') || urlParams.get('batchId') || '';
                const pro = urlParams.get('pro') || urlParams.get('scheduleId') || '';
                const title = urlParams.get('title') || 'StudyAura Video Player';
                const subject = urlParams.get('subject') || '';
                const topic = urlParams.get('topic') || '';

                // 2. Check karein ki ye Live lecture hai ya Recorded
                // Agar URL me live=true ya type=live ho, ya status live ho
                const isLive = urlParams.get('live') === 'true' || 
                               urlParams.get('type') === 'live' || 
                               urlParams.get('isLive') === 'true';

                if (isLive) {
                    statusText.textContent = "Connecting to Live Stream...";

                    // LIVE PLAYER URL FORMAT (Jaisa aapne bataya tha)
                    const liveBaseUrl = "https://studyaura.online/player";
                    const liveParams = new URLSearchParams();
                    
                    if (rc) liveParams.set('rc', rc);
                    if (pro) liveParams.set('pro', pro);
                    if (title) liveParams.set('title', title);
                    if (subject) liveParams.set('subject', subject);
                    if (topic) liveParams.set('topic', topic);
                    
                    liveParams.set('live', 'true');
                    liveParams.set('type', 'live');

                    const finalLiveUrl = `${liveBaseUrl}?${liveParams.toString()}`;
                    
                    // Live player link par redirect karein
                    window.location.replace(finalLiveUrl);

                } else {
                    statusText.textContent = "Loading Recorded Lecture...";

                    // RECORDED PLAYER URL FORMAT (Agar aapka recorded player kisi alag link/route par hai)
                    // Agar recorded ke liye same domain ya koi aur path hai toh yahan configure karein:
                    const recordedBaseUrl = "https://studyaura.online/player"; // Ya aapka recorded player path
                    const recParams = new URLSearchParams();

                    if (rc) recParams.set('rc', rc);
                    if (pro) recParams.set('pro', pro);
                    if (title) recParams.set('title', title);
                    if (subject) recParams.set('subject', subject);

                    // Recorded ke liye live parameters bilkul nahi dalenge
                    const finalRecordedUrl = `${recordedBaseUrl}?${recParams.toString()}`;

                    // Agar current URL me live parameters nahi hain toh wahi rehne dein, warna recorded format par bhej dein
                    if (urlParams.get('live') === 'true') {
                        window.location.replace(finalRecordedUrl);
                    } else {
                        // Yahan aap apna recorded video player ka internal code ya stream loader chala sakte hain
                        console.log("Normal Recorded Player Initialized");
                        // Agar loader hata kar video dikhani ho toh yahan code aayega
                        document.querySelector('.loader-box').style.display = 'none';
                    }
                }
            })();
        </script>
    </body>
</html>
