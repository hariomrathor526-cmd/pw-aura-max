<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Player Loading...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Redirecting to Player...</h2>
        <p>Agar auto-redirect na ho, toh niche click karein:</p>
        <a id="playerBtn" href="#" class="btn">Play Video</a>
    </div>

    <script>
        function getRedirectUrl() {
            const urlParams = new URLSearchParams(window.location.search);

            // Extract IDs
            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';
            
            // Extract Title (Checks 'title', 'topic', 'topicName', or JavaScript global variables)
            let lectureTitle = urlParams.get('title') || 
                               urlParams.get('topic') || 
                               urlParams.get('topicName') || 
                               (typeof TOPIC_NAME !== 'undefined' ? TOPIC_NAME : '') || 
                               (typeof LECTURE_TITLE !== 'undefined' ? LECTURE_TITLE : '');

            // Convert Title automatically if empty
            if (!lectureTitle) {
                lectureTitle = "Lecture Details";
            }

            // New Player Base URL
            const baseUrl = 'https://studyaura.online/player';
            
            // Construct Final URL with properly encoded Title
            const finalUrl = `${baseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(lectureTitle)}`;

            return finalUrl;
        }

        window.onload = function() {
            const targetUrl = getRedirectUrl();
            
            document.getElementById('playerBtn').href = targetUrl;

            // Auto Redirect
            window.location.href = targetUrl;
        };
    </script>
</body>
</html>
