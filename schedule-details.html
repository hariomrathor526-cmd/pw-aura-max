<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .title-display {
            font-size: 16px;
            font-weight: 600;
            color: #1a73e8;
            margin: 15px 0;
            word-break: break-word;
            line-height: 1.4;
        }
        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Ready to Play</h3>
        <div id="topicText" class="title-display">Loading...</div>
        <a id="playLink" href="#" class="play-btn">Play Video</a>
    </div>

    <script>
        function getCleanTitle() {
            const urlParams = new URLSearchParams(window.location.search);

            // 1. Check all URL parameter possibilities INCLUDING 'video'
            let title = urlParams.get('video') || 
                        urlParams.get('title') || 
                        urlParams.get('topic') || 
                        urlParams.get('topicName') || 
                        urlParams.get('name');

            if (title && title.trim() !== "") {
                try {
                    return decodeURIComponent(title);
                } catch(e) {
                    return title;
                }
            }

            // 2. Check Storage
            title = localStorage.getItem('video') ||
                    localStorage.getItem('topicName') || 
                    localStorage.getItem('lectureTitle') || 
                    sessionStorage.getItem('topicName');

            if (title && title.trim() !== "") {
                return title;
            }

            return "Lecture Video";
        }

        function setupPlayer() {
            const urlParams = new URLSearchParams(window.location.search);

            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';

            // Extract Exact Title using video/title param
            const lectureTitle = getCleanTitle();

            // Screen par Title Set Karein
            document.getElementById('topicText').innerText = lectureTitle;

            // Target Player URL Generate Karein (&title= me exact name pass hoga)
            const playerBaseUrl = 'https://studyaura.online/player';
            const finalPlayerUrl = `${playerBaseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(lectureTitle)}`;

            // Play Button Link Set Karein
            document.getElementById('playLink').href = finalPlayerUrl;
        }

        window.onload = setupPlayer;
    </script>
</body>
</html>
