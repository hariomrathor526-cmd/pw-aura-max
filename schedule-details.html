<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StudyAura Video Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --accent: #5a4bda;
            --bg: #000;
            --text: #e8e8f0;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
        }

        #shell {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        #video-col {
            flex: 1;
            position: relative;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .ov {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }

        .ov.off {
            display: none !important;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(90, 75, 218, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="shell">
        <div id="video-col">
            <video id="vid" controls playsinline preload="auto"></video>
            <div class="ov" id="ovLoad">
                <div class="spinner"></div>
                <p id="loadMsg">Detecting Lecture Type...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Live vs Recorded URL Decision Maker
        function createLectureUrl(data) {
            const baseUrl = "https://studyaura.online/player";
            const params = new URLSearchParams();

            if (data.rc) params.set('rc', data.rc);
            if (data.subject) params.set('subject', data.subject);
            if (data.pro) params.set('pro', data.pro);

            if (data.isLive) {
                // Live URL Format
                params.set('title', 'Live');
                if (data.topic) params.set('topic', data.topic);
                params.set('live', 'true');
                params.set('type', 'live');
            } else {
                // Recorded URL Format
                params.set('title', data.title || 'Recorded Lecture');
            }

            return `${baseUrl}?${params.toString()}`;
        }

        // 2. Player Detector & Router Logic
        (function initializePlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const ovLoad = document.getElementById('ovLoad');
            const loadMsg = document.getElementById('loadMsg');

            const title = urlParams.get('title') || '';
            const liveParam = urlParams.get('live');
            const typeParam = urlParams.get('type');

            // Detect Live Status
            const isLive = title.toLowerCase() === 'live' || liveParam === 'true' || typeParam === 'live';

            if (isLive) {
                if (loadMsg) loadMsg.textContent = "Connecting to Live Class...";
                console.log("Playing Mode: LIVE LECTURE");
                
                // Unhide screen after 1.5s (Live Player Init)
                setTimeout(() => {
                    if (ovLoad) ovLoad.classList.add('off');
                }, 1500);

            } else {
                if (loadMsg) loadMsg.textContent = "Loading Recorded Lecture...";
                console.log("Playing Mode: RECORDED LECTURE");

                // Unhide screen after 1s (Recorded Player Init)
                setTimeout(() => {
                    if (ovLoad) ovLoad.classList.add('off');
                }, 1000);
            }
        })();
    </script>
</body>
</html>
