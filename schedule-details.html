<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motion in a Straight Line 05 - Physics By Rajwant Sir</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.debug.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #18181c;
            --bg-tertiary: #222228;
            --accent-color: #5a4bda;
            --accent-hover: #4a3bc7;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --border-color: #2e2e38;
            --live-red: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            height: 56px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .header-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .live-badge {
            background-color: rgba(255, 59, 48, 0.15);
            color: var(--live-red);
            border: 1px solid var(--live-red);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--live-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 56px);
            position: relative;
            overflow: hidden;
        }

        /* Video Section */
        .video-wrapper {
            flex: 1;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Side Panel / Tabs Container */
        .side-panel {
            width: 400px;
            background-color: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 90;
        }

        /* Tab Navigation */
        .tabs-header {
            display: flex;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--text-main);
            border-bottom-color: var(--accent-color);
            background-color: var(--bg-secondary);
        }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            display: none;
            padding: 16px;
        }

        .tab-content.active {
            display: block;
        }

        /* Timeline / Slides Content */
        .timeline-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .timeline-item:hover {
            border-color: var(--accent-color);
        }

        .timeline-thumb {
            width: 100px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #000;
        }

        .timeline-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .timeline-time {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .timeline-title {
            font-size: 14px;
            color: var(--text-main);
        }

        /* Attachments Section */
        .attachment-card {
            background-color: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .attachment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .attachment-title {
            font-weight: 600;
            font-size: 15px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        /* PDF Preview Modal / Area */
        .pdf-viewer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            flex-direction: column;
        }

        .pdf-viewer-header {
            height: 50px;
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .pdf-viewer-body {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .close-pdf {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        /* Custom Overlay Controls */
        .custom-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: var(--accent-color);
            animation: spin 1s linear infinite;
            display: none;
            z-index: 10;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }

            .side-panel {
                width: 100%;
                height: 50%;
            }

            .video-wrapper {
                height: 50%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">Motion in a Straight Line 05 - Physics By Rajwant Sir</div>
        <div class="live-badge">
            <div class="live-dot"></div>
            RECORDED
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-container">
        
        <!-- Video Container -->
        <div class="video-wrapper">
            <div class="custom-loader" id="loader"></div>
            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" controls></video>
            </div>
        </div>

        <!-- Sidebar / Tabs Section -->
        <div class="side-panel">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('slides')">Slides</button>
                <button class="tab-btn" onclick="switchTab('notes')">Notes</button>
                <button class="tab-btn" onclick="switchTab('dpp')">DPP</button>
            </div>

            <!-- Slides / Timeline Tab -->
            <div id="tab-slides" class="tab-content active">
                <div id="timelineContainer"></div>
            </div>

            <!-- Class Notes Tab -->
            <div id="tab-notes" class="tab-content">
                <div class="attachment-card">
                    <div class="attachment-header">
                        <span class="attachment-title">Class Notes PDF</span>
                    </div>
                    <button class="action-btn" onclick="openPDF('notes')">Preview Notes</button>
                    <a id="downloadNotesBtn" class="action-btn" style="background-color: var(--bg-tertiary); border: 1px solid var(--border-color); margin-left: 8px;" target="_blank">Download</a>
                </div>
            </div>

            <!-- DPP Tab -->
            <div id="tab-dpp" class="tab-content">
                <div class="attachment-card">
                    <div class="attachment-header">
                        <span class="attachment-title">DPP 05 - Physics</span>
                    </div>
                    <button class="action-btn" onclick="openPDF('dpp')">Preview DPP</button>
                    <a id="downloadDppBtn" class="action-btn" style="background-color: var(--bg-tertiary); border: 1px solid var(--border-color); margin-left: 8px;" target="_blank">Download</a>
                </div>
            </div>
        </div>
    </div>

    <!-- PDF Viewer Modal -->
    <div class="pdf-viewer-container" id="pdfModal">
        <div class="pdf-viewer-header">
            <span id="pdfTitle">Document Preview</span>
            <button class="close-pdf" onclick="closePDF()">&times;</button>
        </div>
        <div class="pdf-viewer-body" id="pdfBody">
            <canvas id="pdfCanvas"></canvas>
        </div>
    </div>

    <script>
        // Lecture & Credentials Configuration
        const AUTH_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2OGI4MDcyODJjNDExNjE1Mjk3ZmMxYzUiLCJpYXQiOjE3NDIzMTQwNzksImV4cCI6MTc4NzQ5ODA3OX0.zXz9tH-qA9_L53gQp-7H7b0x9U74S9Hj_R98tL4U5vI";
        
        const videoStreamUrl = "https://d1d34p8vz63oiq.cloudfront.net/495d4610-d0ef-4f1e-9279-d5e7ef383181/master.m3u8";

        const attachmentsData = {
            notes: {
                title: "Class Notes - Motion in a Straight Line 05",
                url: "https://d2bp242aedm8b.cloudfront.net/notes/pdf/motion_in_a_straight_line_05.pdf"
            },
            dpp: {
                title: "DPP 05 - Motion in a Straight Line",
                url: "https://d2bp242aedm8b.cloudfront.net/dpp/pdf/dpp_05_motion_straight_line.pdf"
            }
        };

        const slidesData = [
            { time: 0, title: "Slide 1: Introduction", thumb: "https://d1d34p8vz63oiq.cloudfront.net/495d4610-d0ef-4f1e-9279-d5e7ef383181/thumbnails/1.jpg" },
            { time: 180, title: "Slide 2: Calculus Application", thumb: "https://d1d34p8vz63oiq.cloudfront.net/495d4610-d0ef-4f1e-9279-d5e7ef383181/thumbnails/2.jpg" },
            { time: 420, title: "Slide 3: Integration Problems", thumb: "https://d1d34p8vz63oiq.cloudfront.net/495d4610-d0ef-4f1e-9279-d5e7ef383181/thumbnails/3.jpg" },
            { time: 750, title: "Slide 4: Displacement-Time Graph", thumb: "https://d1d34p8vz63oiq.cloudfront.net/495d4610-d0ef-4f1e-9279-d5e7ef383181/thumbnails/4.jpg" },
            { time: 1100, title: "Slide 5: Acceleration Curves", thumb: "https://d1d34p8vz63oiq.cloudfront.net/495d4610-d0ef-4f1e-9279-d5e7ef383181/thumbnails/5.jpg" }
        ];

        // Player Setup
        const video = document.getElementById('videoPlayer');
        const loader = document.getElementById('loader');

        function initPlayer() {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    xhrSetup: function (xhr, url) {
                        xhr.setRequestHeader('Authorization', `Bearer ${AUTH_TOKEN}`);
                        xhr.setRequestHeader('client-type', 'WEB');
                    }
                });
                hls.loadSource(videoStreamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    console.log("HLS Manifest loaded successfully");
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoStreamUrl;
            }
        }

        // Render Slides Timeline
        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            slidesData.forEach(slide => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.onclick = () => seekTo(slide.time);

                const mins = Math.floor(slide.time / 60);
                const secs = slide.time % 60;
                const timeString = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

                item.innerHTML = `
                    <img class="timeline-thumb" src="${slide.thumb}" alt="${slide.title}" onerror="this.src='https://via.placeholder.com/100x56?text=PW'">
                    <div class="timeline-info">
                        <div class="timeline-time">${timeString}</div>
                        <div class="timeline-title">${slide.title}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function seekTo(seconds) {
            video.currentTime = seconds;
            video.play();
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // PDF Preview Handlers
        function openPDF(type) {
            const data = attachmentsData[type];
            if (!data) return;

            document.getElementById('pdfTitle').innerText = data.title;
            document.getElementById('pdfModal').style.display = 'flex';

            // PDF Rendering via pdf.js
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            
            pdfjsLib.getDocument({
                url: data.url,
                httpHeaders: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
            }).promise.then(pdf => {
                pdf.getPage(1).then(page => {
                    const scale = 1.5;
                    const viewport = page.getViewport({ scale: scale });
                    const canvas = document.getElementById('pdfCanvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    page.render({
                        canvasContext: context,
                        viewport: viewport
                    });
                });
            }).catch(err => {
                console.error("PDF load error:", err);
            });
        }

        function closePDF() {
            document.getElementById('pdfModal').style.display = 'none';
        }

        // Attach Links
        document.getElementById('downloadNotesBtn').href = attachmentsData.notes.url;
        document.getElementById('downloadDppBtn').href = attachmentsData.dpp.url;

        // Initialize on page load
        window.onload = () => {
            initPlayer();
            renderTimeline();
        };
    </script>
</body>
</html>
