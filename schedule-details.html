<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Lecture...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .title-display {
            font-size: 18px;
            font-weight: 600;
            color: #1a73e8;
            margin: 15px 0;
            word-break: break-word;
        }
        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Lecture Ready</h3>
        <div id="topicText" class="title-display">Checking Title...</div>
        <a id="playLink" href="#" class="play-btn">Play Video</a>
    </div>

    <script>
        function setupPlayer() {
            const urlParams = new URLSearchParams(window.location.search);

            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';

            // Check all possible title parameter keys in URL
            let extractedTitle = urlParams.get('title') || 
                                 urlParams.get('topic') || 
                                 urlParams.get('topicName') || 
                                 urlParams.get('name') || 
                                 urlParams.get('caption');

            // Decoding URI Component if needed
            if (extractedTitle) {
                try {
                    extractedTitle = decodeURIComponent(extractedTitle);
                } catch(e) {
                    // Keep original if decoding fails
                }
            } else {
                // Default display title if missing
                extractedTitle = "Units and Measurement / Class Lecture";
            }

            // Update UI
            document.getElementById('topicText').innerText = extractedTitle;

            // Generate Final Studyaura Player URL
            const playerBaseUrl = 'https://studyaura.online/player';
            const finalPlayerUrl = `${playerBaseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(extractedTitle)}`;

            // Set link to button
            document.getElementById('playLink').href = finalPlayerUrl;
        }

        window.onload = setupPlayer;
    </script>
</body>
</html>
