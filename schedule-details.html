<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Fetching Details & Live Status...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function slugify(text) {
                if (!text) return 'lecture';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            function buildPlayerUrl(data) {
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (data.isLive) {
                    // LIVE URL FORMAT
                    if (data.rc) params.set('rc', data.rc);
                    if (data.pro) params.set('pro', data.pro);
                    if (data.title) params.set('title', data.title);
                    if (data.subject) params.set('subject', slugify(data.subject));
                    if (data.topic) params.set('topic', slugify(data.topic));
                    params.set('live', 'true');
                    params.set('type', 'live');
                } else {
                    // RECORDED URL FORMAT
                    if (data.rc) params.set('rc', data.rc);
                    if (data.subject) params.set('subject', data.subject);
                    if (data.pro) params.set('pro', data.pro);
                    params.set('title', data.title || 'StudyAura Video Player');
                }

                return `${baseUrl}?${params.toString()}`;
            }

            async function processAllApisAndRedirect() {
                const urlParams = new URLSearchParams(window.location.search);

                const rc = urlParams.get('rc') || urlParams.get('batchId');
                const subject = urlParams.get('subject') || urlParams.get('subjectId');
                const pro = urlParams.get('pro') || urlParams.get('scheduleId');
                
                let title = urlParams.get('title') || 'StudyAura Video Player';
                let topicName = urlParams.get('topic') || '';
                let subjectName = subject;
                let isLive = false;

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Required Parameters!";
                    return;
                }

                // API Calls array
                const scheduleApiUrl = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subject}/schedule/${pro}/schedule-details`;
                const todaysScheduleApiUrl = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;
                const videoLinkApiUrl = `https://api.studyspark.study/api/video-link?batchId=${rc}&subjectId=${subject}&scheduleId=${pro}`;

                try {
                    const [schedRes, todayRes, videoRes] = await Promise.allSettled([
                        fetch(scheduleApiUrl),
                        fetch(todaysScheduleApiUrl),
                        fetch(videoLinkApiUrl)
                    ]);

                    // 1. Extract Details from Schedule Details API
                    if (schedRes.status === 'fulfilled' && schedRes.value.ok) {
                        const sJson = await schedRes.value.json();
                        const sData = sJson.data || {};
                        title = sData.topic || sData.title || title;
                        topicName = sData.topic || topicName || title;
                        if (sData.subjectId && sData.subjectId.name) {
                            subjectName = sData.subjectId.name;
                        }
                        if (sData.status === 'LIVE' || sData.isLive === true || sData.isLiveStream === true) {
                            isLive = true;
                        }
                    }

                    // 2. Extract Details from Video Link API
                    if (videoRes.status === 'fulfilled' && videoRes.value.ok) {
                        const vJson = await videoRes.value.json();
                        const vData = vJson.data || vJson || {};
                        if (vData.title) title = vData.title;
                        if (vData.topic) topicName = vData.topic;
                        if (vData.isLive === true || vData.type === 'LIVE' || vData.streamType === 'LIVE') {
                            isLive = true;
                        }
                    }

                    // 3. Extract Details from Today's Schedule API
                    if (todayRes.status === 'fulfilled' && todayRes.value.ok) {
                        const tJson = await todayRes.value.json();
                        const schedules = tJson.data || tJson || [];
                        if (Array.isArray(schedules)) {
                            const matched = schedules.find(item => item._id === pro || item.scheduleId === pro || item.id === pro);
                            if (matched) {
                                title = matched.topic || matched.title || title;
                                topicName = matched.topic || matched.title || topicName;
                                const statusUpper = String(matched.status || '').toUpperCase();
                                if (statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || matched.isLive === true) {
                                    isLive = true;
                                }
                            }
                        }
                    }

                } catch (err) {
                    console.warn("API check failed:", err);
                }

                // URL Override Check
                if (urlParams.get('live') === 'true' || urlParams.get('type') === 'live') {
                    isLive = true;
                }

                const finalUrl = buildPlayerUrl({
                    rc: rc,
                    pro: pro,
                    subject: subjectName,
                    title: title,
                    topic: topicName || title,
                    isLive: isLive
                });

                window.location.replace(finalUrl);
            }

            processAllApisAndRedirect();
        </script>
    </body>
</html>
