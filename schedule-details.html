<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
                display: block;
                outline: none
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10;
                transition: opacity 0.3s ease;
            }

            #ovLoad {
                background: rgba(0,0,0,.88)
            }

            #ovLoad.off {
                display: none !important;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.75)
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" controls playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Loading Player...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Utility to build Live URL format
            function buildLiveUrl(params) {
                const baseUrl = "https://studyaura.online/player";
                const p = new URLSearchParams();
                
                if (params.get('rc')) p.set('rc', params.get('rc'));
                if (params.get('pro')) p.set('pro', params.get('pro'));
                if (params.get('title')) p.set('title', params.get('title'));
                if (params.get('subject')) p.set('subject', params.get('subject'));
                if (params.get('topic')) p.set('topic', params.get('topic'));
                
                p.set('live', 'true');
                p.set('type', 'live');

                return `${baseUrl}?${p.toString()}`;
            }

            // Load Video Stream
            function loadVideoStream(videoUrl) {
                const video = document.getElementById('vid');
                const ovLoad = document.getElementById('ovLoad');

                if (Hls.isSupported() && videoUrl.includes('.m3u8')) {
                    const hls = new Hls();
                    hls.loadSource(videoUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        ovLoad.classList.add('off');
                        video.play().catch(() => {});
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = videoUrl;
                    video.addEventListener('loadedmetadata', function () {
                        ovLoad.classList.add('off');
                        video.play().catch(() => {});
                    });
                } else {
                    video.src = videoUrl;
                    ovLoad.classList.add('off');
                    video.play().catch(() => {});
                }
            }

            // Main Execution Engine
            (function initPlayer() {
                const urlParams = new URLSearchParams(window.location.search);
                const ovLoad = document.getElementById('ovLoad');
                const loadMsg = document.getElementById('loadMsg');

                const isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                const hasLiveIdentifiers = urlParams.get('topic') || urlParams.get('subject')?.includes('-');
                const videoStreamUrl = urlParams.get('url') || urlParams.get('stream') || urlParams.get('video');

                // 1. LIVE LECTURE HANDLING
                if (isLive || (hasLiveIdentifiers && !videoStreamUrl)) {
                    loadMsg.innerText = "Opening Live Stream...";
                    
                    // Agar URL me live=true miss hai toh correct URL par redirect karein
                    if (!isLive) {
                        const targetUrl = buildLiveUrl(urlParams);
                        window.location.href = targetUrl;
                        return;
                    }

                    // Standard Live Player stream load logic
                    if (videoStreamUrl) {
                        loadVideoStream(videoStreamUrl);
                    } else {
                        // Hide loader if playing inside external player embed
                        setTimeout(() => ovLoad.classList.add('off'), 1500);
                    }
                } 
                // 2. RECORDED LECTURE HANDLING
                else {
                    loadMsg.innerText = "Loading Recorded Lecture...";

                    if (videoStreamUrl) {
                        loadVideoStream(videoStreamUrl);
                    } else {
                        // Recorded video - stop spinner & show player controls
                        setTimeout(() => {
                            ovLoad.classList.add('off');
                        }, 800);
                    }
                }
            })();
        </script>
    </body>
</html>
