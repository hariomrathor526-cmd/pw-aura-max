<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Detecting Live / Recorded Stream...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function buildPlayerUrl(data) {
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (data.isLive) {
                    // LIVE URL FORMAT
                    if (data.rc) params.set('rc', data.rc);
                    if (data.pro) params.set('pro', data.pro);
                    if (data.title) params.set('title', data.title);
                    if (data.subject) params.set('subject', data.subject);
                    if (data.topic) params.set('topic', data.topic);
                    params.set('live', 'true');
                    params.set('type', 'live');
                } else {
                    // RECORDED URL FORMAT
                    if (data.rc) params.set('rc', data.rc);
                    if (data.subject) params.set('subject', data.subject);
                    if (data.pro) params.set('pro', data.pro);
                    params.set('title', data.title || 'StudyAura Video Player');
                }

                return `${baseUrl}?${params.toString()}`;
            }

            async function fetchAndRedirect() {
                const urlParams = new URLSearchParams(window.location.search);

                const rc = urlParams.get('rc') || urlParams.get('batchId');
                const subject = urlParams.get('subject') || urlParams.get('subjectId');
                const pro = urlParams.get('pro') || urlParams.get('scheduleId');
                const incomingTitle = urlParams.get('title');

                if (!rc || !pro || !subject) {
                    document.getElementById('loadMsg').innerText = "Missing required URL parameters!";
                    return;
                }

                const apiEndpoint = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subject}/schedule/${pro}/schedule-details`;

                try {
                    const response = await fetch(apiEndpoint);
                    const result = await response.json();
                    const scheduleData = result.data || {};

                    // Checking ALL Penpencil/PW API Live Flags
                    const statusUpper = String(scheduleData.status || '').toUpperCase();
                    const typeUpper = String(scheduleData.type || '').toUpperCase();
                    
                    const isLiveApi = statusUpper === 'LIVE' || 
                                      statusUpper === 'UPCOMING' || 
                                      typeUpper === 'LIVE' || 
                                      scheduleData.isLive === true || 
                                      scheduleData.isLiveStream === true ||
                                      scheduleData.live === true;

                    // URL Params or Referrer Check
                    const isLiveParam = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                    const isFromStream = document.referrer.includes('stream.html');

                    // Final Live Decision
                    const isLive = isLiveApi || isLiveParam || isFromStream;

                    const lectureTitle = incomingTitle || scheduleData.topic || scheduleData.title || 'StudyAura Video Player';
                    
                    // Slug / Topic formatting for Live URL
                    let topicSlug = scheduleData.topic || scheduleData.topicSlug || incomingTitle || 'lecture';
                    topicSlug = topicSlug.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

                    let subjectSlug = scheduleData.subjectSlug || scheduleData.subjectId?.name || subject;
                    subjectSlug = subjectSlug.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

                    const finalUrl = buildPlayerUrl({
                        rc: rc,
                        pro: pro,
                        subject: subjectSlug,
                        title: lectureTitle,
                        topic: topicSlug,
                        isLive: isLive
                    });

                    window.location.replace(finalUrl);
                } catch (error) {
                    console.error("API Fetch Error:", error);
                    // Fallback using URL flags
                    const isLiveFallback = urlParams.get('live') === 'true' || document.referrer.includes('stream.html');
                    const fallbackUrl = buildPlayerUrl({
                        rc: rc,
                        subject: subject,
                        pro: pro,
                        title: incomingTitle || 'StudyAura Video Player',
                        topic: 'lecture',
                        isLive: isLiveFallback
                    });
                    window.location.replace(fallbackUrl);
                }
            }

            fetchAndRedirect();
        </script>
    </body>
</html>
