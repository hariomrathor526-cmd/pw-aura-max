<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
                display: block;
                outline: none;
                pointer-events: none
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            #ovLoad.off {
                display: none
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            #ovErr {
                background: rgba(0,0,0,.88);
                display: none;
                padding: 20px;
                text-align: center
            }

            #ovErr.on {
                display: flex
            }

            #ovErr p {
                font-size: 14px;
                color: #ff6584;
                max-width: 300px;
                line-height: 1.5
            }

            #ovErr button {
                padding: 8px 22px;
                background: var(--accent);
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                cursor: pointer;
                font-family: inherit;
                margin-top: 4px
            }

            #bufSpin {
                position: absolute;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 8;
                pointer-events: none
            }

            #bufSpin.on {
                display: flex
            }

            #bufSpin::after {
                content: '';
                width: 42px;
                height: 42px;
                border-radius: 50%;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                animation: spin .75s linear infinite
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Loading Player...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Utility function to play or open lectures conditionally
            function playLecture(lectureData) {
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                // Common IDs
                if (lectureData.rc || lectureData.batchId) params.set('rc', lectureData.rc || lectureData.batchId);
                if (lectureData.pro || lectureData.scheduleId) params.set('pro', lectureData.pro || lectureData.scheduleId);
                if (lectureData.title) params.set('title', lectureData.title);
                if (lectureData.subject) params.set('subject', lectureData.subject);

                // Differentiate Live vs Normal Lecture
                if (lectureData.isLive === true || lectureData.type === 'live') {
                    if (lectureData.topic) params.set('topic', lectureData.topic);
                    params.set('live', 'true');
                    params.set('type', 'live');
                } else {
                    // Normal recorded lecture parameters
                    if (lectureData.videoId) params.set('videoId', lectureData.videoId);
                }

                window.location.href = `${baseUrl}?${params.toString()}`;
            }

            // Init & Validation
            (function handlePlayerUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';

                if (isLive) {
                    console.log("Playing Live Lecture Stream...");
                    document.getElementById('loadMsg').innerText = "Connecting to Live Lecture...";
                    // Handle Live video stream setup here
                } else {
                    console.log("Playing Recorded Lecture...");
                    document.getElementById('loadMsg').innerText = "Loading Recorded Lecture...";
                    // Handle Normal recorded video stream setup here
                }
            })();
        </script>
    </body>
</html>
