<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Details</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .title-display {
            font-size: 16px;
            font-weight: 600;
            color: #1a73e8;
            margin: 15px 0;
            word-break: break-word;
            line-height: 1.4;
            min-height: 40px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="loader" class="loader"></div>
        <div id="topicText" class="title-display">Lecture Title Loading...</div>
        <a id="playLink" href="#" class="play-btn" style="display:none;">Play Video</a>
    </div>

    <script>
        // Deep search function in LocalStorage / SessionStorage for Schedule ID
        function searchTitleInStorage(scheduleId) {
            const storages = [localStorage, sessionStorage];
            
            for (let storage of storages) {
                for (let i = 0; i < storage.length; i++) {
                    const key = storage.key(i);
                    const value = storage.getItem(key);
                    
                    if (value && value.includes(scheduleId)) {
                        try {
                            const parsed = JSON.parse(value);
                            
                            // Recursive search in JSON object
                            const foundTitle = findTopicInObject(parsed, scheduleId);
                            if (foundTitle) return foundTitle;
                        } catch (e) {
                            // Non-JSON string, check string
                        }
                    }
                }
            }
            return null;
        }

        // Helper to crawl inside nested JS objects
        function findTopicInObject(obj, targetId) {
            if (!obj || typeof obj !== 'object') return null;

            if (Array.isArray(obj)) {
                for (let item of obj) {
                    const result = findTopicInObject(item, targetId);
                    if (result) return result;
                }
            } else {
                if ((obj._id === targetId || obj.id === targetId || obj.scheduleId === targetId)) {
                    return obj.topic || obj.title || obj.topicName || obj.name || obj.caption;
                }
                for (let k in obj) {
                    if (typeof obj[k] === 'object') {
                        const res = findTopicInObject(obj[k], targetId);
                        if (res) return res;
                    }
                }
            }
            return null;
        }

        async function loadLectureData() {
            const urlParams = new URLSearchParams(window.location.search);

            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';

            let topicName = '';

            // Method 1: Check Direct URL Parameters
            topicName = urlParams.get('title') || urlParams.get('topic') || urlParams.get('topicName') || urlParams.get('name');

            // Method 2: Scan Browser Memory (LocalStorage / SessionStorage)
            if (!topicName && scheduleId) {
                topicName = searchTitleInStorage(scheduleId);
            }

            // Method 3: Try Vercel / Penpaper API Endpoints
            if (!topicName && scheduleId) {
                const endpoints = [
                    `https://pw-steel-beta.vercel.app/api/schedule-details?scheduleId=${scheduleId}`,
                    `https://pw-steel-beta.vercel.app/api/schedule/${scheduleId}`,
                    `https://api.penpaper.workers.dev/schedule/${scheduleId}`
                ];

                for (let api of endpoints) {
                    try {
                        const res = await fetch(api);
                        if (res.ok) {
                            const json = await res.json();
                            const data = json.data || json;
                            const found = data.topic || data.title || data.name || data.topicName;
                            if (found) {
                                topicName = found;
                                break;
                            }
                        }
                    } catch (e) {
                        // ignore API error, try next
                    }
                }
            }

            // Final fallback if nothing is found anywhere
            if (!topicName) {
                topicName = "Lecture Video";
            }

            // Update UI
            document.getElementById('loader').style.display = 'none';
            document.getElementById('topicText').innerText = topicName;

            // Generate Target Player Link for Studyaura
            const playerBaseUrl = 'https://studyaura.online/player';
            const finalPlayerUrl = `${playerBaseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(topicName)}`;

            const playBtn = document.getElementById('playLink');
            playBtn.href = finalPlayerUrl;
            playBtn.style.display = 'inline-block';
        }

        window.onload = loadLectureData;
    </script>
</body>
</html>
