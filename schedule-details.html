<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            /* Video Details Header Header Bar */
            #info-header {
                padding: 12px 16px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                z-index: 20;
            }

            .badge {
                display: inline-block;
                padding: 2px 8px;
                font-size: 11px;
                font-weight: 600;
                border-radius: 4px;
                background: var(--accent);
                color: #fff;
                margin-bottom: 4px;
                text-transform: uppercase;
            }

            .badge.live {
                background: #ff4757;
            }

            #video-title {
                font-size: 16px;
                font-weight: 600;
                color: var(--text);
                margin-bottom: 2px;
            }

            #video-topic {
                font-size: 13px;
                color: var(--muted);
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <!-- Header for Title and Topic -->
            <div id="info-header">
                <span id="video-badge" class="badge">RECORDED</span>
                <div id="video-title">Loading title...</div>
                <div id="video-topic">Loading topic...</div>
            </div>

            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Fetching Details from API...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Text ko slug format me convert karne ka function
            function slugify(text) {
                if (!text) return '';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            async function processScheduleDetails() {
                const urlParams = new URLSearchParams(window.location.search);

                // Sample default IDs for fallback (jo aapne provided URL me diye the)
                const defaultBatchId = "698ad3519549b300a5e1cc6a";
                const defaultSubjectId = "69b569aeeffdf9567d75f816";
                const defaultScheduleId = "6a0191586c12456e9078970e";

                const rc = urlParams.get('rc') || urlParams.get('batchId') || defaultBatchId;
                const subjectInput = urlParams.get('subject') || urlParams.get('subjectId') || defaultSubjectId;
                const pro = urlParams.get('pro') || urlParams.get('scheduleId') || defaultScheduleId;

                let isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                let title = urlParams.get('title') || '';
                let topicRaw = urlParams.get('topic') || '';
                let subjectSlug = subjectInput;

                // Targeted Schedule Details API
                const v1ScheduleApi = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subjectInput}/schedule/${pro}/schedule-details`;
                const v2TodaysApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;

                try {
                    const [resV1, resV2] = await Promise.allSettled([
                        fetch(v1ScheduleApi),
                        fetch(v2TodaysApi)
                    ]);

                    // 1. Fetch details from main Schedule API (V1)
                    if (resV1.status === 'fulfilled' && resV1.value.ok) {
                        const json = await resV1.value.json();
                        const data = json.data || json || {};

                        if (data.topic) topicRaw = data.topic;
                        if (data.title) title = data.title;

                        // Extracting Subject Slug / Name
                        if (data.subjectId) {
                            if (typeof data.subjectId === 'object') {
                                subjectSlug = data.subjectId.slug || slugify(data.subjectId.name) || subjectInput;
                            }
                        }

                        const statusUpper = String(data.status || '').toUpperCase();
                        if (statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || data.isLive === true || data.isLiveStream === true) {
                            isLive = true;
                        }
                    }

                    // 2. Fetch details from Today's Schedule API (V2)
                    if (resV2.status === 'fulfilled' && resV2.value.ok) {
                        const json = await resV2.value.json();
                        const list = json.data || json || [];
                        if (Array.isArray(list)) {
                            const match = list.find(i => i._id === pro || i.scheduleId === pro || i.id === pro);
                            if (match) {
                                isLive = true;
                                if (match.topic) topicRaw = match.topic;
                                if (match.title) title = match.title;
                                if (match.subjectId && match.subjectId.name) {
                                    subjectSlug = slugify(match.subjectId.name);
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("API Fetching Error:", e);
                }

                // Fallback for Topic if missing
                if (!topicRaw && title) {
                    topicRaw = title.split(':')[0].split('-')[0].trim();
                }

                // Set default titles if still empty
                title = title || 'StudyAura Video Lecture';
                topicRaw = topicRaw || 'General Topic';

                // DOM UPDATE - UI Me title & topic set karna
                document.getElementById('video-title').innerText = title;
                document.getElementById('video-topic').innerText = `Topic: ${topicRaw}`;
                
                const badgeEl = document.getElementById('video-badge');
                if (isLive) {
                    badgeEl.innerText = "LIVE STREAM";
                    badgeEl.classList.add('live');
                } else {
                    badgeEl.innerText = "RECORDED";
                    badgeEl.classList.remove('live');
                }

                // Hide loader overlay after data load
                document.getElementById('ovLoad').style.display = 'none';

                // Note: Agar aap automatic redirect chahte hain to neeche wali lines uncomment karein:
                /*
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();
                params.set('rc', rc);
                params.set('pro', pro);
                params.set('title', title);
                params.set('subject', subjectSlug); 
                params.set('topic', slugify(topicRaw)); 
                if (isLive) params.set('live', 'true');
                window.location.replace(`${baseUrl}?${params.toString()}`);
                */
            }

            processScheduleDetails();
        </script>
    </body>
</html>
