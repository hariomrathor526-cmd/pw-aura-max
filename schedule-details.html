<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Checking Today's Schedule...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function slugify(text) {
                if (!text) return 'lecture';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            function buildPlayerUrl(data) {
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (data.isLive) {
                    // LIVE URL FORMAT
                    if (data.rc) params.set('rc', data.rc);
                    if (data.pro) params.set('pro', data.pro);
                    if (data.title) params.set('title', data.title);
                    if (data.subject) params.set('subject', slugify(data.subject));
                    if (data.topic) params.set('topic', slugify(data.topic));
                    params.set('live', 'true');
                    params.set('type', 'live');
                } else {
                    // RECORDED URL FORMAT
                    if (data.rc) params.set('rc', data.rc);
                    if (data.subject) params.set('subject', data.subject);
                    if (data.pro) params.set('pro', data.pro);
                    params.set('title', data.title || 'StudyAura Video Player');
                }

                return `${baseUrl}?${params.toString()}`;
            }

            async function checkTodaysScheduleAndRedirect() {
                const urlParams = new URLSearchParams(window.location.search);

                const rc = urlParams.get('rc') || urlParams.get('batchId');
                const subject = urlParams.get('subject') || urlParams.get('subjectId');
                const pro = urlParams.get('pro') || urlParams.get('scheduleId');
                let title = urlParams.get('title') || 'StudyAura Video Player';
                let topicName = urlParams.get('topic') || '';
                let subjectName = subject;

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Required IDs!";
                    return;
                }

                let isLive = false;

                try {
                    // Call todays-schedule API
                    const todaysScheduleApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;
                    const res = await fetch(todaysScheduleApi);
                    
                    if (res.ok) {
                        const json = await res.json();
                        const schedules = json.data || json || [];

                        // Find matching item in today's schedule array
                        const matchedSchedule = Array.isArray(schedules) 
                            ? schedules.find(item => item._id === pro || item.scheduleId === pro || item.id === pro)
                            : null;

                        if (matchedSchedule) {
                            const statusUpper = String(matchedSchedule.status || '').toUpperCase();
                            const typeUpper = String(matchedSchedule.type || '').toUpperCase();

                            // Check status flags returned in today's schedule
                            const isLiveStatus = statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || typeUpper === 'LIVE';
                            const isLiveBool = matchedSchedule.isLive === true || matchedSchedule.isLiveStream === true;

                            if (isLiveStatus || isLiveBool) {
                                isLive = true;
                                title = matchedSchedule.topic || matchedSchedule.title || title;
                                topicName = matchedSchedule.topic || matchedSchedule.title || topicName;
                                if (matchedSchedule.subjectId && matchedSchedule.subjectId.name) {
                                    subjectName = matchedSchedule.subjectId.name;
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn("todays-schedule API check failed:", e);
                }

                // URL Flag override as backup
                if (urlParams.get('live') === 'true' || urlParams.get('type') === 'live') {
                    isLive = true;
                }

                const finalUrl = buildPlayerUrl({
                    rc: rc,
                    pro: pro,
                    subject: subjectName,
                    title: title,
                    topic: topicName || title,
                    isLive: isLive
                });

                window.location.replace(finalUrl);
            }

            checkTodaysScheduleAndRedirect();
        </script>
    </body>
</html>
