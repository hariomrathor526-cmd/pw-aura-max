<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Processing Batch & Chat Details...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function slugify(text) {
                if (!text) return 'lecture';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            async function processAllDataAndRedirect() {
                const urlParams = new URLSearchParams(window.location.search);

                const rc = urlParams.get('rc') || urlParams.get('batchId');
                const subject = urlParams.get('subject') || urlParams.get('subjectId');
                const pro = urlParams.get('pro') || urlParams.get('scheduleId');
                const tagId = urlParams.get('tagId') || '';
                const conversationId = urlParams.get('conversationId') || pro;

                let title = urlParams.get('title') || 'StudyAura Video Player';
                let topicName = urlParams.get('topic') || '';
                let subjectName = subject;
                let isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Required IDs!";
                    return;
                }

                // All Target APIs
                const v1ScheduleApi = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subject}/schedule/${pro}/schedule-details`;
                const v2TodaysApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;
                const v3ContentsApi = `https://api.studyaura.online/api/penpencil/batch-service/v3/batch-subject-schedules/${rc}/subject/${subject}/contents?skip=0&limit=30&contentType=LECTURES${tagId ? '&tagId=' + tagId : ''}`;
                const chatApi = `https://api.studyspark.study/api/conversation/${conversationId}/chat?batchId=${rc}`;

                try {
                    const [resV1, resV2, resV3, resChat] = await Promise.allSettled([
                        fetch(v1ScheduleApi),
                        fetch(v2TodaysApi),
                        fetch(v3ContentsApi),
                        fetch(chatApi)
                    ]);

                    // 1. Process V1 Schedule Details
                    if (resV1.status === 'fulfilled' && resV1.value.ok) {
                        const d = (await resV1.value.json()).data || {};
                        title = d.topic || d.title || title;
                        topicName = d.topic || topicName || title;
                        if (d.subjectId && d.subjectId.name) subjectName = d.subjectId.name;
                        if (d.status === 'LIVE' || d.isLive === true || d.isLiveStream === true) isLive = true;
                    }

                    // 2. Process V2 Today's Schedule
                    if (resV2.status === 'fulfilled' && resV2.value.ok) {
                        const list = (await resV2.value.json()).data || [];
                        if (Array.isArray(list)) {
                            const match = list.find(i => i._id === pro || i.scheduleId === pro || i.id === pro);
                            if (match) {
                                title = match.topic || match.title || title;
                                topicName = match.topic || topicName || title;
                                const st = String(match.status || '').toUpperCase();
                                if (st === 'LIVE' || st === 'UPCOMING' || match.isLive === true) isLive = true;
                            }
                        }
                    }

                    // 3. Process V3 Contents API
                    if (resV3.status === 'fulfilled' && resV3.value.ok) {
                        const contents = (await resV3.value.json()).data || [];
                        if (Array.isArray(contents)) {
                            const match = contents.find(i => i._id === pro || i.scheduleId === pro);
                            if (match) {
                                title = match.topic || match.title || title;
                                topicName = match.topic || topicName || title;
                                if (match.status === 'LIVE' || match.isLive === true || match.isLiveStream === true) isLive = true;
                            }
                        }
                    }

                    // 4. Process Chat API (If chat is active, stream is usually LIVE)
                    if (resChat.status === 'fulfilled' && resChat.value.ok) {
                        const chatData = await resChat.value.json();
                        if (chatData && (chatData.success || chatData.data || chatData.isLive)) {
                            // Active conversation endpoint confirms live stream state
                            if (chatData.isLive === true || chatData.status === 'LIVE') {
                                isLive = true;
                            }
                        }
                    }

                } catch (e) {
                    console.warn("API check warning:", e);
                }

                // Construct Redirect URL
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (isLive) {
                    params.set('rc', rc);
                    params.set('pro', pro);
                    params.set('title', title);
                    params.set('subject', slugify(subjectName));
                    params.set('topic', slugify(topicName || title));
                    params.set('live', 'true');
                    params.set('type', 'live');
                } else {
                    params.set('rc', rc);
                    params.set('subject', subject);
                    params.set('pro', pro);
                    params.set('title', title);
                }

                window.location.replace(`${baseUrl}?${params.toString()}`);
            }

            processAllDataAndRedirect();
        </script>
    </body>
</html>
