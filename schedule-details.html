<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg)
                }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Fetching Complete Stream Details...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function slugify(text) {
                if (!text) return '';
                return text.toString().toLowerCase()
                    .replace(/\s+/g, '-')
                    .replace(/[^\w\-]+/g, '')
                    .replace(/\-\-+/g, '-')
                    .replace(/^-+/, '')
                    .replace(/-+$/, '');
            }

            async function processAllDataAndRedirect() {
                const urlParams = new URLSearchParams(window.location.search);

                const rc = urlParams.get('rc') || urlParams.get('batchId');
                const subjectInput = urlParams.get('subject') || urlParams.get('subjectId');
                const pro = urlParams.get('pro') || urlParams.get('scheduleId');
                const tagId = urlParams.get('tagId') || '';
                const conversationId = urlParams.get('conversationId') || pro;

                if (!rc || !pro) {
                    document.getElementById('loadMsg').innerText = "Missing Batch or Schedule ID!";
                    return;
                }

                let isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';
                let title = urlParams.get('title') || 'StudyAura Video Player';
                let topicRaw = urlParams.get('topic') || '';
                let subjectSlug = subjectInput;

                // All APIs Integration
                const v1ScheduleApi = `https://api.studyaura.online/api/penpencil/v1/batches/${rc}/subject/${subjectInput}/schedule/${pro}/schedule-details`;
                const v2TodaysApi = `https://api.studyaura.online/api/penpencil/v2/batches/${rc}/todays-schedule?batchId=${rc}`;
                const v3ContentsApi = `https://api.studyaura.online/api/penpencil/batch-service/v3/batch-subject-schedules/${rc}/subject/${subjectInput}/contents?skip=0&limit=30&contentType=LECTURES${tagId ? '&tagId=' + tagId : ''}`;
                const chatApi = `https://api.studyspark.study/api/conversation/${conversationId}/chat?batchId=${rc}`;

                try {
                    const [resV1, resV2, resV3, resChat] = await Promise.allSettled([
                        fetch(v1ScheduleApi),
                        fetch(v2TodaysApi),
                        fetch(v3ContentsApi),
                        fetch(chatApi)
                    ]);

                    // 1. Process V1 Schedule Details
                    if (resV1.status === 'fulfilled' && resV1.value.ok) {
                        const json = await resV1.value.json();
                        const data = json.data || {};

                        if (data.topic) topicRaw = data.topic;
                        if (data.title) title = data.title;

                        if (data.subjectId) {
                            if (data.subjectId.slug) subjectSlug = data.subjectId.slug;
                            else if (data.subjectId.name) subjectSlug = slugify(data.subjectId.name);
                        }

                        const statusUpper = String(data.status || '').toUpperCase();
                        if (statusUpper === 'LIVE' || statusUpper === 'UPCOMING' || data.isLive === true || data.isLiveStream === true) {
                            isLive = true;
                        }
                    }

                    // 2. Process V2 Today's Schedule
                    if (resV2.status === 'fulfilled' && resV2.value.ok) {
                        const json = await resV2.value.json();
                        const list = json.data || json || [];
                        if (Array.isArray(list)) {
                            const match = list.find(i => i._id === pro || i.scheduleId === pro || i.id === pro);
                            if (match) {
                                isLive = true;
                                if (match.topic) topicRaw = match.topic;
                                if (match.title) title = match.title;
                                if (match.subjectId && match.subjectId.name) {
                                    subjectSlug = slugify(match.subjectId.name);
                                }
                            }
                        }
                    }

                    // 3. Process V3 Contents API (To fetch correct Title/Topic from lectures list)
                    if (resV3.status === 'fulfilled' && resV3.value.ok) {
                        const json = await resV3.value.json();
                        const contents = json.data || [];
                        if (Array.isArray(contents)) {
                            const match = contents.find(i => i._id === pro || i.scheduleId === pro);
                            if (match) {
                                if (match.topic) topicRaw = match.topic;
                                if (match.title) title = match.title;
                                if (match.status === 'LIVE' || match.isLive === true || match.isLiveStream === true) {
                                    isLive = true;
                                }
                            }
                        }
                    }

                    // 4. Process Chat API
                    if (resChat.status === 'fulfilled' && resChat.value.ok) {
                        const chatData = await resChat.value.json();
                        if (chatData && (chatData.isLive === true || chatData.status === 'LIVE')) {
                            isLive = true;
                        }
                    }

                } catch (e) {
                    console.warn("API processing warning:", e);
                }

                // Fallback for Topic extraction from Title if empty
                if (!topicRaw && title) {
                    topicRaw = title.split(':')[0].split('-')[0].trim();
                }

                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (isLive) {
                    // LIVE URL FORMAT
                    params.set('rc', rc);
                    params.set('pro', pro);
                    params.set('title', title);
                    params.set('subject', subjectSlug);
                    params.set('topic', slugify(topicRaw));
                    params.set('live', 'true');
                    params.set('type', 'live');
                } else {
                    // RECORDED URL FORMAT
                    params.set('rc', rc);
                    params.set('subject', subjectInput);
                    params.set('pro', pro);
                    params.set('title', title);
                }

                window.location.replace(`${baseUrl}?${params.toString()}`);
            }

            processAllDataAndRedirect();
        </script>
    </body>
</html>
