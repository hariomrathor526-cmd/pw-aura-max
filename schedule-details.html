<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <title>StudyAura Video Player</title>
        <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            *,*::before,*::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none
            }

            :root {
                --accent: #5a4bda;
                --bg: #000;
                --surface: #111118;
                --surface2: #1c1c27;
                --border: rgba(255,255,255,.1);
                --text: #e8e8f0;
                --muted: #7070a0;
                --note: #3ecfcf;
                --dpp: #ff9f43
            }

            html,body {
                height: 100%;
                width: 100%;
                overflow: hidden;
                background: var(--bg);
                font-family: 'DM Sans',-apple-system,sans-serif;
                color: var(--text)
            }

            #shell {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                background: var(--bg);
                overflow: hidden
            }

            #main-row {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: row;
                overflow: hidden
            }

            #video-col {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
                background: #000;
                overflow: hidden
            }

            #vid-box {
                position: absolute;
                inset: 0;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center
            }

            video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
                display: block;
                outline: none;
                pointer-events: auto
            }

            .ov {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                z-index: 10
            }

            #ovLoad {
                background: rgba(0,0,0,.82)
            }

            #ovLoad.off {
                display: none !important;
            }

            .spinner {
                width: 40px;
                height: 40px;
                border: 3px solid rgba(90,75,218,.18);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin .8s linear infinite
            }

            #ovLoad p {
                font-size: 13px;
                color: rgba(255,255,255,.65)
            }

            @keyframes spin {
                to { transform: rotate(360deg) }
            }
        </style>
    </head>
    <body>
        <div id="shell">
            <div id="main-row">
                <div id="video-col">
                    <div id="vid-box">
                        <video id="vid" controls playsinline preload="auto"></video>
                        <div class="ov" id="ovLoad">
                            <div class="spinner"></div>
                            <p id="loadMsg">Checking Lecture Type...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            // Helper to build StudyAura Live Stream URL
            function buildLivePlayerUrl(data) {
                const baseUrl = "https://studyaura.online/player";
                const params = new URLSearchParams();

                if (data.rc) params.set('rc', data.rc);
                if (data.pro) params.set('pro', data.pro);
                if (data.title) params.set('title', data.title);
                if (data.subject) params.set('subject', data.subject);
                if (data.topic) params.set('topic', data.topic);

                params.set('live', 'true');
                params.set('type', 'live');

                return `${baseUrl}?${params.toString()}`;
            }

            // Main Execution Routine
            (function initPlayer() {
                const urlParams = new URLSearchParams(window.location.search);
                const loadOverlay = document.getElementById('ovLoad');
                const loadMsg = document.getElementById('loadMsg');

                const rc = urlParams.get('rc') || urlParams.get('batchId');
                const pro = urlParams.get('pro') || urlParams.get('scheduleId');
                const title = urlParams.get('title') || '';
                const subject = urlParams.get('subject') || '';
                const topic = urlParams.get('topic') || '';

                const isLive = urlParams.get('live') === 'true' || urlParams.get('type') === 'live';

                // Scenario 1: Live lecture link (studyaura live format par direct karein)
                if (isLive) {
                    if (loadMsg) loadMsg.textContent = "Redirecting to Live Stream...";
                    const liveUrl = buildLivePlayerUrl({ rc, pro, title, subject, topic });

                    if (window.location.href !== liveUrl) {
                        window.location.href = liveUrl;
                    }
                    return;
                }

                // Scenario 2: Recorded Lecture Handle
                if (loadMsg) loadMsg.textContent = "Loading Video...";

                const videoSource = urlParams.get('url') || urlParams.get('src') || urlParams.get('v');

                if (videoSource) {
                    const videoElement = document.getElementById('vid');
                    
                    if (Hls.isSupported() && videoSource.endsWith('.m3u8')) {
                        const hls = new Hls();
                        hls.loadSource(videoSource);
                        hls.attachMedia(videoElement);
                    } else {
                        videoElement.src = videoSource;
                    }

                    videoElement.onloadeddata = () => {
                        if (loadOverlay) loadOverlay.classList.add('off');
                    };
                } else {
                    // Agar specific source URL nahi hai toh loader hide karke player unblock karein
                    setTimeout(() => {
                        if (loadOverlay) loadOverlay.classList.add('off');
                    }, 1200);
                }
            })();
        </script>
    </body>
</html>
