<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Player...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .title-display {
            font-size: 16px;
            font-weight: 600;
            color: #1a73e8;
            margin: 15px 0;
            word-break: break-word;
            line-height: 1.4;
            min-height: 40px;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .play-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }
        .play-btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Playing Lecture</h3>
        <div id="loader" class="loader"></div>
        <div id="topicText" class="title-display">Fetching exact title...</div>
        <a id="playLink" href="#" class="play-btn" style="display:none;">Play Video</a>
    </div>

    <script>
        async function fetchExactTitle(scheduleId, batchId, subjectId) {
            // 1. URL Parameter check
            const urlParams = new URLSearchParams(window.location.search);
            let title = urlParams.get('title') || urlParams.get('topic') || urlParams.get('topicName');
            if (title && title.trim()) return decodeURIComponent(title);

            // 2. Local/Session Storage check
            title = localStorage.getItem('topicName') || 
                    localStorage.getItem('lectureTitle') || 
                    localStorage.getItem('topic') || 
                    sessionStorage.getItem('topicName') || 
                    sessionStorage.getItem('topic');
            if (title && title.trim()) return title;

            // 3. Direct PW Schedule CDN Fetching
            if (scheduleId) {
                try {
                    const endpoints = [
                        `https://dev.penpaper.workers.dev/schedule/${scheduleId}`,
                        `https://api.penpaper.workers.dev/schedule/${scheduleId}`
                    ];

                    for (let url of endpoints) {
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            const item = data.data || data;
                            const foundTopic = item.topic || item.topicName || item.name || item.title;
                            if (foundTopic) return foundTopic;
                        }
                    }
                } catch (e) {
                    console.log("Failed to fetch from API", e);
                }
            }

            return "Lecture Details";
        }

        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);

            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';

            // Get exact title
            const exactTitle = await fetchExactTitle(scheduleId, batchId, subjectId);

            // Hide loader & display title
            document.getElementById('loader').style.display = 'none';
            document.getElementById('topicText').innerText = exactTitle;

            // Generate player URL
            const playerBaseUrl = 'https://studyaura.online/player';
            const finalPlayerUrl = `${playerBaseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(exactTitle)}`;

            // Set link and show play button
            const playBtn = document.getElementById('playLink');
            playBtn.href = finalPlayerUrl;
            playBtn.style.display = 'inline-block';
        }

        window.onload = initPlayer;
    </script>
</body>
</html>
