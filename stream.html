<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .lecture-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
        }
        .lecture-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 16px;
            max-width: 70%;
        }
        .play-btn {
            background-color: #28a745;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .play-btn:hover {
            background-color: #218838;
        }
        .loader {
            text-align: center;
            font-size: 18px;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="pageTitle">Lecture List</h2>
        <div id="loading" class="loader">Loading Lectures...</div>
        <div id="lectureList"></div>
    </div>

    <script>
        // URL se BatchId aur SubjectId nikalna
        const urlParams = new URLSearchParams(window.location.search);
        const batchId = urlParams.get('batchId') || '';
        const subjectId = urlParams.get('subjectId') || '';
        const scheduleId = urlParams.get('scheduleId') || '';

        // Player URL Generate karne ka Function
        function buildPlayerUrl(bId, sId, schId, title) {
            const baseUrl = 'https://studyaura.online/player';
            return `${baseUrl}?rc=${encodeURIComponent(bId)}&subject=${encodeURIComponent(sId)}&pro=${encodeURIComponent(schId)}&title=${encodeURIComponent(title)}`;
        }

        // Single Lecture ke liye Direct Open karne ka Function
        function playVideo(schId, titleName) {
            const finalUrl = buildPlayerUrl(batchId, subjectId, schId, titleName);
            window.location.href = finalUrl;
        }

        // API se Lectures fetch karke Page par dikhana
        async function loadScheduleDetails() {
            const loadingDiv = document.getElementById('loading');
            const lectureListDiv = document.getElementById('lectureList');

            try {
                // Single Schedule Fetch agar ScheduleID milli ho
                if (scheduleId) {
                    const response = await fetch(`https://api.penpaper.workers.dev/schedule/${scheduleId}`);
                    const result = await response.json();
                    
                    const item = result.data || result;
                    const topicTitle = item.topic || item.name || "Lecture Video";

                    loadingDiv.style.display = "none";
                    lectureListDiv.innerHTML = `
                        <div class="lecture-card">
                            <div class="lecture-title">${topicTitle}</div>
                            <button class="play-btn" onclick="playVideo('${scheduleId}', \`${topicTitle}\`)">Play Lecture</button>
                        </div>
                    `;
                    return;
                }

                // Multiple Schedule/Lectures Fetching agar sirf Batch & Subject diya ho
                const response = await fetch(`https://api.penpaper.workers.dev/schedule?batchId=${batchId}&subjectId=${subjectId}`);
                const result = await response.json();
                const lectures = result.data || result || [];

                loadingDiv.style.display = "none";

                if (!lectures || lectures.length === 0) {
                    lectureListDiv.innerHTML = "<p style='text-align:center;'>No lectures found.</p>";
                    return;
                }

                // Loop karke saare lectures show karna
                let htmlContent = '';
                lectures.forEach(lecture => {
                    const schId = lecture._id || lecture.id;
                    const topicTitle = lecture.topic || lecture.name || "Lecture Video";
                    const playerLink = buildPlayerUrl(batchId, subjectId, schId, topicTitle);

                    htmlContent += `
                        <div class="lecture-card">
                            <div class="lecture-title">${topicTitle}</div>
                            <a href="${playerLink}" class="play-btn">Play Video</a>
                        </div>
                    `;
                });

                lectureListDiv.innerHTML = htmlContent;

            } catch (error) {
                console.error("Error loading data:", error);
                loadingDiv.innerText = "Failed to load lectures. Please try again.";
            }
        }

        // Page load hone par call hoga (BINA Auto-Redirect Ke)
        window.onload = loadScheduleDetails;
    </script>

</body>
</html>
