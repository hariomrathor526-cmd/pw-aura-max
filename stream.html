<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Lecture...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="statusText">Fetching Lecture Details...</h2>
        <div class="loader" id="loader"></div>
        <p id="subText">Please wait while we redirect you to the new player.</p>
        <a id="playerBtn" href="#" class="btn" style="display: none;">Play Video</a>
    </div>

    <script>
        async function fetchAndRedirect() {
            const urlParams = new URLSearchParams(window.location.search);

            const batchId = urlParams.get('batchId') || '';
            const subjectId = urlParams.get('subjectId') || '';
            const scheduleId = urlParams.get('scheduleId') || '';

            // Check URL title param first
            let lectureTitle = urlParams.get('title') || urlParams.get('topic') || urlParams.get('topicName');

            // If title is missing in URL, fetch details from PW API
            if (!lectureTitle && scheduleId) {
                try {
                    // Fetching schedule/lecture details using API
                    const response = await fetch(`https://api.penpaper.workers.dev/schedule/${scheduleId}`);
                    const data = await response.json();

                    // Topic Name/Title from API
                    lectureTitle = data?.data?.topic || data?.topic || data?.data?.name || data?.name;
                } catch (error) {
                    console.error("API error, falling back:", error);
                }
            }

            // Fallback if API fails
            if (!lectureTitle) {
                lectureTitle = "Lecture";
            }

            // Construct new player URL
            const baseUrl = 'https://studyaura.online/player';
            const finalPlayerUrl = `${baseUrl}?rc=${encodeURIComponent(batchId)}&subject=${encodeURIComponent(subjectId)}&pro=${encodeURIComponent(scheduleId)}&title=${encodeURIComponent(lectureTitle)}`;

            // UI Updates & Auto Redirect
            document.getElementById('statusText').innerText = "Redirecting...";
            document.getElementById('playerBtn').href = finalPlayerUrl;
            document.getElementById('playerBtn').style.display = "inline-block";

            window.location.href = finalPlayerUrl;
        }

        window.onload = fetchAndRedirect;
    </script>
</body>
</html>
